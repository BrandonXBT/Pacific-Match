<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pacific Pods Game</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="assets/logo.png" type="image/png">
</head>
<body>
  <!-- HUD HEADER (added, non-destructive) -->
  <header class="hud-header">
    <div class="brand">
      <img class="brand-logo" src="assets/logo.png" alt="Fogo logo" />
      <div>
        <div class="brand-title">Pacific Pods</div>
        <div class="brand-sub">Ahoy! 🌊🐬</div>
      </div>
    </div>
    <div class="hud-right">
      <button id="hintBtn" class="btn ghost">Hint</button>
      <div class="pill"><b id="scoreTop">0</b> | <span id="timeTop">60s</span></div>
      
    </div>
  </header>

  
  <main class="layout">
    <section class="board-wrap">
      <div id="game">
        <div class="old-mini-hud">
          <div>Score: <span id="score">0</span></div>
          <div id="timer">Time: 60s</div>
        </div>
        <div id="board"></div>
      </div>
    </section>

    <aside class="sidebar">
      <div class="card scoreboard">
        <div class="card-title"><span>🏆</span> Scoreboard</div>
        <div class="big-score">

  <span class="logo-star" aria-hidden="true">⭐</span>

  <span id="scoreBig">0</span>

  <span class="best-pill">
    Best: <b id="bestPill">0</b>
  </span>

</div>
<button id="newStartBtn" class="big-start-btn">
  ▶ START GAME
</button>
        <div class="time-left">
          <span>⏱</span><span>Time Left</span><b id="timeLeftBig">60s</b>
        </div>
        <div class="threshold-row"><span>POD ENERGY</span><span><b id="thresholdNum">0</b>/500</span></div>
        <div class="progress"><div id="progressBar"></div></div>
        <small class="helper">Recharge the Pacific Pod before time runs out</small>
      </div>
    </aside>
  </main>

  <footer class="credits">created by <a href="https://x.com/0xbrandonsol" target="_blank" rel="noopener noreferrer">Brandon.btc</a></footer>




  <script src="script.js"></script>
</body>
</html>
